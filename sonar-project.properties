sonar.projectKey=NoelKofmel_astra
sonar.organization=noelkofmel
sonar.projectName=astra

# Analysed by the sonarqube job in .github/workflows/ci.yml, after the check job
# has produced the coverage report. Automatic Analysis in SonarQube Cloud must
# stay off: it cannot import coverage (docs/08-operations.md#sonarqube).

# Everything in the repository is analysed — TypeScript, Dockerfile, workflows,
# Compose files, shell scripts — except dependencies, build output and the
# generated migrations. Test files count as tests, not as source code.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/.next/**,**/.turbo/**,**/coverage/**,packages/db/drizzle/**,**/*.test.ts
sonar.tests=.
sonar.test.inclusions=**/*.test.ts
sonar.test.exclusions=**/node_modules/**

# Written by `pnpm test:coverage`, paths relative to the repository root.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Tooling configuration is not application code.
sonar.coverage.exclusions=**/*.config.ts,**/*.config.js

sonar.sourceEncoding=UTF-8
