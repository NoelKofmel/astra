name: CI/CD

# push to main: check → sonarqube, images → deploy.  Pull requests: check → sonarqube.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes its running check pointless. On main
# nothing is cancelled: a deploy must never stop halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Same image as infra/docker-compose.*.yml
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://astra:astra@localhost:5432/astra

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm from packageManager, Node from .nvmrc, then a frozen install.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

      # Handed to the sonarqube job.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 3

      - name: Migrations apply to an empty database
        run: pnpm db:migrate

      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "::error::packages/db/src/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain -- packages/db/drizzle
            exit 1
          fi

      - run: pnpm build

  # Its own job, so a SonarQube outage never holds up a deploy. The quality
  # gate shows up on the pull request, not as a failure here.
  sonarqube:
    name: SonarQube
    needs: check
    # Pull requests from forks get no secrets, so they cannot be analysed here.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so SonarQube can tell new code from old.
          fetch-depth: 0

      # Installed dependencies give the analysis the types of imported packages.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  images:
    name: Image (${{ matrix.target }})
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        id: image
        # GHCR wants lowercase; infra/docker-compose.yml uses the same names.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/astra-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy
    needs: images
    # Switched on by setting the repository variable ASTRA_URL (docs/08-operations.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ASTRA_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.ASTRA_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host astra
            HostName ${DEPLOY_HOST}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
          EOF

      - name: Copy compose file, Caddyfile and scripts
        run: |
          scp infra/docker-compose.yml infra/deploy.sh infra/backup.sh astra:/opt/astra/
          scp infra/caddy/Caddyfile astra:/opt/astra/caddy/

      - name: Let the server pull from GHCR for this deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh astra docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Deploy
        run: |
          # Expanded on the runner on purpose — the server does not know the SHA.
          # shellcheck disable=SC2029
          ssh astra bash /opt/astra/deploy.sh "$GITHUB_SHA"

      - name: Log the server out of GHCR
        if: always()
        run: ssh astra docker logout ghcr.io || true

      - name: Verify the new release is live
        env:
          ASTRA_URL: ${{ vars.ASTRA_URL }}
        run: |
          health="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 "${ASTRA_URL}/api/health")"
          echo "$health"
          test "$(jq -r .version <<< "$health")" = "$GITHUB_SHA"
